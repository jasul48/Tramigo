<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Tramigo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0066cc;
            --primary-gradient: linear-gradient(135deg, #0066cc 0%, #004a99 100%);
            --hero-bg-gradient: linear-gradient(135deg, #f0f7ff 0%, #dbeafe 100%);
            --text-dark: #0b2246;
            --text-muted: #475569;
            --white: #ffffff;
            --bg-light: #f8fafc;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            background: var(--hero-bg-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .auth-container {
            background: var(--white);
            padding: 3.5rem;
            border-radius: 2rem;
            box-shadow: 0 20px 50px rgba(0, 102, 204, 0.08);
            width: 100%;
            max-width: 540px;
            text-align: center;
            border: 1px solid rgba(0, 102, 204, 0.05);
        }

        .auth-container h1 {
            color: var(--text-dark);
            margin-top: 0;
            margin-bottom: 2rem;
            font-weight: 800;
            font-size: 2.2rem;
        }

        .form-row {
            display: flex;
            gap: 1rem;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #555;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: var(--primary-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }

        .btn-submit {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 1rem;
            width: 100%;
            border-radius: 0.8rem;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            box-shadow: 0 4px 15px rgba(0, 102, 204, 0.2);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #0052a3 0%, #003d80 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 102, 204, 0.3);
        }

        .auth-links {
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .auth-links a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        .flash-messages {
            margin-bottom: 1.5rem;
        }
        
        .flash-message {
            padding: 0.8rem;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .flash-error {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h1>Crear Cuenta</h1>

        <div class="flash-container" th:if="${successMessage != null or errorMessage != null}">
            <div class="flash-alert flash-success" th:if="${successMessage != null}" th:text="${successMessage}"></div>
            <div class="flash-alert flash-error" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>
        </div>

        <form action="/registro" method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Juan">
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" required placeholder="Pérez">
                </div>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono (Opcional)</label>
                <input type="tel" id="telefono" name="telefono" placeholder="55 1234 5678">
            </div>
            
            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" required placeholder="tu@email.com">
            </div>
            
            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required placeholder="Crea una contraseña segura">
            </div>

            <button type="submit" class="btn-submit">Registrarse</button>
        </form>

        <div class="auth-links">
            ¿Ya tienes cuenta? <a href="/login">Inicia Sesión aquí</a><br><br>
            <a href="/index">← Volver al Inicio</a>
        </div>
    </div>

</body>
</html>
