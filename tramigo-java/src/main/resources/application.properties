spring.application.name=tramigo-web
server.port=8080

# ==========================================
# BASE DE DATOS (MySQL)
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/logintramigo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# SUBIDA DE ARCHIVOS
# ==========================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Carpetas de subidas relativas al directorio de ejecución
tramigo.upload.profiles=uploads/perfiles
tramigo.upload.docs=uploads/documentos

# Servir archivos estáticos y subidas
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# ==========================================
# CONFIGURACIÓN DE CORREO (Gmail SMTP)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==========================================
# THYMELEAF
# ==========================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# URL del API Gateway: localhost al ejecutar la web fuera de Docker; api-gateway dentro de Compose.
tramigo.api.base-url=${TRAMIGO_API_URL:http://localhost:8090}
