<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactar Soporte - Tramigo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0066cc;
            --primary-gradient: linear-gradient(135deg, #0066cc 0%, #004a99 100%);
            --hero-bg-gradient: linear-gradient(135deg, #f0f7ff 0%, #dbeafe 100%);
            --text-dark: #0b2246;
            --text-muted: #475569;
            --white: #ffffff;
            --bg-light: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--hero-bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: var(--text-dark);
        }
        .back-link {
            align-self: flex-start;
            margin-left: calc(50% - 280px);
            text-decoration: none;
            color: var(--primary-blue);
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0, 102, 204, 0.08);
            border-radius: 30px;
            transition: all 0.3s ease;
        }
        .back-link:hover {
            background: rgba(0, 102, 204, 0.15);
            transform: translateX(-5px);
        }
        .contact-card {
            background: var(--white);
            border-radius: 2rem;
            box-shadow: 0 20px 50px rgba(0, 102, 204, 0.08);
            padding: 50px;
            width: 100%;
            max-width: 560px;
            border: 1px solid rgba(0, 102, 204, 0.05);
        }
        .contact-card h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 8px;
        }
        .contact-card p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 35px;
        }
        /* Flash messages */
        .flash-msg {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.88rem;
            font-weight: 600;
        }
        .flash-success { background: #e8f5e9; color: #2e7d32; border-left: 4px solid #4caf50; }
        .flash-error   { background: #ffebee; color: #c62828; border-left: 4px solid #f44336; }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.88rem;
            color: #444;
            margin-bottom: 6px;
        }
        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #dde3f0;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: var(--text-dark);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            margin-bottom: 18px;
            background: #f9fbff;
        }
        input:focus, textarea:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
            background: white;
        }
        textarea { resize: vertical; min-height: 140px; }
        .btn-send {
            width: 100%;
            padding: 16px;
            background: var(--primary-gradient);
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 102, 204, 0.2);
        }
        .btn-send:hover {
            background: linear-gradient(135deg, #0052a3 0%, #003d80 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 102, 204, 0.3);
        }
        .btn-send:active { transform: scale(0.98); }
        .dest-info {
            text-align: center;
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <a href="/index" class="back-link">← Volver al inicio</a>

    <div class="contact-card">
        <h1>📬 Contactar Soporte</h1>
        <p class="subtitle">¿Tienes una duda o necesitas ayuda? Elige el método que prefieras y te ayudaremos.</p>

        <div class="flash-container" th:if="${successMessage != null or errorMessage != null}">
            <div class="flash-alert flash-success" th:if="${successMessage != null}" th:text="${successMessage}"></div>
            <div class="flash-alert flash-error" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>
        </div>

        <div class="support-options">
            <a href="https://wa.me/521234567890" target="_blank" class="opt-card whatsapp">
                <span class="icon">💬</span>
                <div class="opt-text">
                    <strong>WhatsApp</strong>
                    <span>Respuesta rápida</span>
                </div>
            </a>
            <a href="mailto:soporte@tramigo.com" class="opt-card email">
                <span class="icon">📧</span>
                <div class="opt-text">
                    <strong>Correo Directo</strong>
                    <span>soporte@tramigo.com</span>
                </div>
            </a>
        </div>

        <div class="divider"><span>O envíanos un ticket</span></div>

        <form method="POST" action="/contacto">
            <label for="nombre">Tu nombre completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez García" required>

            <label for="correo">Tu correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="Ej: juan@gmail.com" required>

            <label for="asunto">Asunto</label>
            <input type="text" id="asunto" name="asunto" placeholder="Ej: Duda sobre trámite de INE" required>

            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" placeholder="Describe tu duda o problema con detalle..." required></textarea>

            <button type="submit" class="btn-send">Levantar Ticket de Soporte</button>
        </form>
        <p class="dest-info">Tu mensaje se guardará en nuestro sistema de atención.</p>
    </div>

    <style>
        .support-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        .opt-card {
            text-decoration: none;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            border: 1px solid #eee;
        }
        .opt-card .icon { font-size: 1.5rem; }
        .opt-card strong { display: block; color: var(--text-dark); font-size: 0.9rem; }
        .opt-card span { color: var(--text-muted); font-size: 0.75rem; }
        
        .opt-card.whatsapp { background: #e8f5e9; border-color: #c8e6c9; }
        .opt-card.whatsapp:hover { background: #c8e6c9; transform: translateY(-3px); }
        
        .opt-card.email { background: #e3f2fd; border-color: #bbdefb; }
        .opt-card.email:hover { background: #bbdefb; transform: translateY(-3px); }

        .divider {
            position: relative;
            text-align: center;
            margin: 25px 0;
        }
        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: #eee;
            z-index: 1;
        }
        .divider span {
            position: relative;
            z-index: 2;
            background: white;
            padding: 0 15px;
            color: #999;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</body>
</html>
