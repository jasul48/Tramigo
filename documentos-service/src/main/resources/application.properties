# Puerto único para el microservicio de documentos
server.port=8082

# Nombre de la aplicación en Eureka
spring.application.name=documentos-service

# Configuración de Base de Datos MySQL (db_documentos)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/db_documentos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Registro en Eureka Server
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Configuración de Multipart (subida de archivos)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Directorio de documentos subidos
tramigo.upload.docs=uploads/documentos

# Validar que el usuario exista consultando a usuarios-service (via Eureka)
tramigo.usuarios.validar=true
