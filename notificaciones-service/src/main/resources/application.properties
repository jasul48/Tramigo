# Puerto único para el microservicio de notificaciones
server.port=8084

# Nombre de la aplicación en Eureka
spring.application.name=notificaciones-service

# Configuración de Base de Datos MySQL (db_notificaciones)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/db_notificaciones?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Registro en Eureka Server
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Correo (Gmail SMTP). Las credenciales se leen de variables de entorno:
#   MAIL_USERNAME, MAIL_PASSWORD (contraseña de aplicación de Gmail) y, opcionalmente, SOPORTE_EMAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Correo que recibe los mensajes de contacto (si se omite, se usa MAIL_USERNAME)
tramigo.notificaciones.soporte-email=${SOPORTE_EMAIL:}
