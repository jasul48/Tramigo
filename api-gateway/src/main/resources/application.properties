# Puerto del API Gateway (punto único de entrada a los microservicios)
server.port=8090

# Nombre de la aplicación en Eureka
spring.application.name=api-gateway

# Registro en Eureka Server
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# El gateway solo reenvía: no procesa multipart, deja pasar el cuerpo tal cual hacia documentos-service / usuarios-service
spring.servlet.multipart.enabled=false

# ==========================================
# RUTAS (lb:// = balanceo de carga via Eureka)
# notificaciones-service es interno y NO se expone aquí.
# ==========================================

# usuarios-service
spring.cloud.gateway.server.webmvc.routes[0].id=usuarios-auth
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://usuarios-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=usuarios-usuarios
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://usuarios-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/usuarios/**

spring.cloud.gateway.server.webmvc.routes[2].id=usuarios-personas
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://usuarios-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/personas/**

# Fotos de perfil (las sirve usuarios-service)
spring.cloud.gateway.server.webmvc.routes[3].id=usuarios-uploads
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://usuarios-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/uploads/**

# documentos-service
spring.cloud.gateway.server.webmvc.routes[4].id=documentos
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://documentos-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/documentos/**

# soporte-service
spring.cloud.gateway.server.webmvc.routes[5].id=soporte
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://soporte-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/soporte/**

# tramites-service
spring.cloud.gateway.server.webmvc.routes[6].id=tramites
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://tramites-service
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/tramites/**

# seguimiento-service
spring.cloud.gateway.server.webmvc.routes[7].id=seguimiento
spring.cloud.gateway.server.webmvc.routes[7].uri=lb://seguimiento-service
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/api/seguimiento/**
